# Ograničenje broja zahtjeva po izvornoj IP adresi: 10 zahtjeva u minuti,
# uz dopuštenih 5 zahtjeva iznad te stope prije odbijanja.
limit_req_zone $binary_remote_addr zone=piston_limit:10m rate=10r/m;

server {
    listen 2001;

    # Zahtjev se prihvaća samo ako sadrži ispravno tajno zaglavlje,
    # koje je poznato isključivo poslužiteljskoj funkciji.
    location / {
        if ($http_x_piston_token != "OVDJE_UPISI_DUGI_TAJNI_NIZ") {
            return 403;
        }

        limit_req zone=piston_limit burst=5 nodelay;
        limit_req_status 429;

        client_max_body_size 64k;

        proxy_pass http://api:2000;
        proxy_read_timeout 30s;
    }
}
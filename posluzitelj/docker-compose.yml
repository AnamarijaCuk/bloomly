version: "3"

services:
  api:
    image: ghcr.io/engineer-man/piston
    restart: always
    privileged: true
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec
      - /tmp:exec
    environment:
      # --- izričita ograničenja izvršavanja korisničkog koda ---
      PISTON_RUN_TIMEOUT: 5000            # najdulje trajanje izvršavanja (ms)
      PISTON_COMPILE_TIMEOUT: 10000       # najdulje trajanje prevođenja (ms)
      PISTON_RUN_CPU_TIME: 5000           # najdulje procesorsko vrijeme (ms)
      PISTON_RUN_MEMORY_LIMIT: 256000000  # najviše memorije po izvršavanju (B)
      PISTON_COMPILE_MEMORY_LIMIT: 256000000
      PISTON_OUTPUT_MAX_SIZE: 65536       # najveća veličina ispisa (B)
      PISTON_MAX_PROCESS_COUNT: 64        # najveći broj procesa po izvršavanju
      PISTON_MAX_OPEN_FILES: 2048         # najveći broj istodobno otvorenih datoteka
      PISTON_DISABLE_NETWORKING: "true"   # izvršavanje bez pristupa mreži
    # --- ograničenja na razini samog kontejnera ---
    mem_limit: 2g
    cpus: 2.0

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "2001:2001"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api